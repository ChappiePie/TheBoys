plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/${project.archives_base_name}.accesswidener")
    runs {
        server {
            runDir "run/server"
        }
    }
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex("com\\.geckolib.*")
			includeGroup("com.eliotlash.mclib")
		}
	}
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = 'BlameJared Maven (CrT / Bookshelf)'
		url = 'https://maven.blamejared.com'
	}
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	mavenLocal()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
	implementation("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	compileOnly "maven.modrinth:modmenu:${project.mod_menu_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}+${project.minecraft_version}"

	api "fuzs.forgeconfigapiport:forgeconfigapiport-common:${project.fcap_version}"
	implementation include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fcap_version}")

	implementation include("com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

	implementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
	implementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")

	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	implementation "chappie.modulus:modulus:${minecraft_version}-${project.modulus_version}"

	runtimeOnly "maven.modrinth:modmenu:${project.mod_menu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
